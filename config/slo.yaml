service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: Người dùng cần nhận được câu trả lời thành công trong tối đa 3 giây; mục tiêu 99.5% giữ trải nghiệm ổn định nhưng vẫn dành một phần nhỏ cho sự cố và thay đổi có kiểm soát.
  error_budget:
    formula: total_requests * (1 - target_percent / 100)
    example_total_requests: 10000
    allowed_bad_requests: 50
    explanation: Với 10,000 request trong 28 ngày, tối đa 50 request được phép lỗi hoặc chậm hơn 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
